<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>PPT 自动相机</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box} body{margin:0;background:#000;color:#fff}
main{max-width:900px;margin:auto;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
h1{font-size:20px;margin:12px 0}.stage{position:relative;background:#111;border-radius:14px;overflow:hidden}
video{display:block;width:100%;max-height:65vh;object-fit:contain;background:#000}
.roi{position:absolute;left:8%;top:10%;width:84%;height:65%;border:2px solid #fff;border-radius:8px;box-shadow:0 0 0 9999px #0005;pointer-events:none}
.status{padding:10px 2px 3px;font-weight:600}.debug{padding:0 2px 9px;color:#9aa0a6;font-size:12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:650}
.primary{background:#fff;color:#000}.secondary{background:#2c2c2e;color:#fff}
.settings{margin-top:12px;padding:12px;background:#1c1c1e;border-radius:14px}
label{display:grid;grid-template-columns:130px 1fr 48px;gap:8px;align-items:center;margin:9px 0;font-size:14px}
input[type=range]{width:100%}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px}
.note{font-size:12px;color:#aaa;line-height:1.4;margin:10px 2px}
</style>
</head>
<body><main>
<h1>PPT 自动相机</h1>
<div class="stage"><video id="video" playsinline autoplay muted></video><div class="roi"></div></div>
<div class="status" id="status">先启动相机</div>
<div class="debug" id="debug">检测器 v3 · 最近照片对比模式</div>
<div class="controls">
<button class="primary" id="camera">启动相机</button>
<button class="secondary" id="auto" disabled>开始自动记录</button>
<button class="secondary" id="shot" disabled>手动保存</button>
<button class="secondary" id="export" disabled>导出本节照片</button>
</div>
<div class="settings">
<label>差异阈值 <input id="change" type="range" min="1" max="12" value="3"><span id="changeV">3</span></label>
<label>稳定阈值 <input id="stable" type="range" min="1" max="12" value="5"><span id="stableV">5</span></label>
<label>稳定时间 <input id="stableMs" type="range" min="300" max="2000" step="100" value="800"><span id="stableMsV">0.8s</span></label>
<label>冷却时间 <input id="coolMs" type="range" min="800" max="5000" step="200" value="1800"><span id="coolMsV">1.8s</span></label>
</div>
<div class="note">开始自动记录后会先保存当前页。此后实时画面始终与最近一次成功拍摄的照片画面比较；内容不一致并重新稳定后就拍照。算法会忽略整体亮度波动和轻微传感器噪声，差异阈值越低越灵敏。</div>
<div class="thumbs" id="thumbs"></div>
<canvas id="work" width="192" height="108" hidden></canvas>
<canvas id="capture" hidden></canvas>
</main>
<script>
const $=id=>document.getElementById(id);
const video=$('video'), work=$('work'), wctx=work.getContext('2d',{willReadFrequently:true});
const capture=$('capture'), cctx=capture.getContext('2d');
const DETECT_W=192, DETECT_H=108, PIXEL_DELTA=10, CHANGE_CONFIRM_MS=160;
let stream=null, running=false, lastPhotoFrame=null, prev=null, changing=false, saving=false;
let stableSince=0, stableAnchor=null, changeSince=0, changeStartedAt=0;
let lastShot=0, raf=0, timer=0, runToken=0;
let shots=[];

function say(s){$('status').textContent=s}
function vals(){
 return {change:+$('change').value, stable:+$('stable').value,
 stableMs:+$('stableMs').value, cool:+$('coolMs').value}
}
for(const id of ['change','stable','stableMs','coolMs']) $(id).oninput=()=>{
 $('changeV').textContent=$('change').value;
 $('stableV').textContent=$('stable').value;
 $('stableMsV').textContent=(+$('stableMs').value/1000).toFixed(1)+'s';
 $('coolMsV').textContent=(+$('coolMs').value/1000).toFixed(1)+'s';
};

async function startCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}},audio:false
  });
  video.srcObject=stream; await video.play();
  $('auto').disabled=false;$('shot').disabled=false;
  say('相机已启动 · 对准 PPT 后开始自动记录');
 }catch(e){say('无法打开相机：'+e.message)}
}
$('camera').onclick=startCamera;

function grayFrame(){
 const vw=video.videoWidth,vh=video.videoHeight;
 const sx=vw*.08, sy=vh*.10, sw=vw*.84, sh=vh*.65;
 wctx.drawImage(video,sx,sy,sw,sh,0,0,DETECT_W,DETECT_H);
 const d=wctx.getImageData(0,0,DETECT_W,DETECT_H).data;
 const a=new Uint8Array(DETECT_W*DETECT_H);
 for(let i=0,j=0;i<d.length;i+=4,j++) a[j]=(d[i]*3+d[i+1]*6+d[i+2])/10;
 return a;
}

// Compensate for a global brightness shift, then combine average structural
// difference with the percentage of pixels that changed significantly. A
// small changed text region is therefore not diluted by a large plain slide.
function frameMetrics(a,b){
 if(!a||!b)return {mean:0,changedRatio:0,strongRatio:0,topMean:0,score:0};
 let signed=0;
 for(let i=0;i<a.length;i++) signed+=a[i]-b[i];
 const brightnessShift=signed/a.length;
 let sum=0, changed=0, strong=0;
 const histogram=new Uint16Array(256);
 for(let i=0;i<a.length;i++){
  const delta=Math.abs((a[i]-b[i])-brightnessShift);
  sum+=delta;
  histogram[Math.min(255,Math.floor(delta))]++;
  if(delta>=PIXEL_DELTA)changed++;
  if(delta>=24)strong++;
 }
 const mean=sum/a.length;
 const changedRatio=changed*100/a.length;
 const strongRatio=strong*100/a.length;
 const topCount=Math.max(1,Math.floor(a.length*.02));
 let remaining=topCount,topSum=0;
 for(let value=255;value>=0&&remaining;value--){
  const take=Math.min(remaining,histogram[value]);
  topSum+=take*value;remaining-=take;
 }
 const topMean=topSum/topCount;
 return {mean,changedRatio,strongRatio,topMean,
  score:mean+changedRatio*1.6+strongRatio*1.2+topMean*.08};
}

function isPageChange(metrics,threshold){
 // Even a small changed text area should trigger, while sub-threshold camera
 // noise and uniform projector brightness shifts are ignored.
 return metrics.score>=threshold || metrics.changedRatio>=Math.max(.35,threshold*.12);
}

function detectorSelfTest(){
 const base=new Uint8Array(1000).fill(80);
 const brighter=new Uint8Array(1000).fill(92);
 const textChange=new Uint8Array(base);
 for(let i=0;i<20;i++)textChange[i]=180;
 const brightnessIgnored=frameMetrics(brighter,base).score<.01;
 const smallTextDetected=isPageChange(frameMetrics(textChange,base),3);
 return brightnessIgnored&&smallTextDetected;
}

async function saveFrame(referenceFrame=grayFrame()){
 if(!video.videoWidth||saving)return false;
 const saveToken=runToken;
 saving=true;
 lastShot=performance.now();
 capture.width=video.videoWidth;capture.height=video.videoHeight;
 cctx.drawImage(video,0,0,capture.width,capture.height);
 const blob=await new Promise(r=>capture.toBlob(r,'image/jpeg',0.95));
 if(!blob){saving=false;say('保存失败 · 请手动保存');return false}
 const url=URL.createObjectURL(blob);
 shots.push({blob,url,name:`PPT_${String(shots.length+1).padStart(3,'0')}.jpg`});
 const img=new Image();img.src=url;$('thumbs').prepend(img);
 $('export').disabled=false;
 if(saveToken===runToken)lastPhotoFrame=referenceFrame;
 saving=false;
 if(navigator.vibrate) navigator.vibrate(40);
 say(`已记录 ${shots.length} 页 · 与最近照片对比中`);
 return true;
}
$('shot').onclick=()=>void saveFrame(grayFrame());

function scheduleLoop(token){
 timer=setTimeout(()=>raf=requestAnimationFrame(t=>loop(t,token)),80);
}

function loop(t,token){
 if(!running||token!==runToken)return;
 const cur=grayFrame(), v=vals();
 if(!lastPhotoFrame){
  prev=cur;changeSince=0;
  if(!saving){say('正在保存第一张作为对比基准…');void saveFrame(cur)}
  scheduleLoop(token);return;
 }
 const fromPhoto=frameMetrics(cur,lastPhotoFrame);
 const frameDelta=frameMetrics(cur,prev);
 const different=isPageChange(fromPhoto,v.change);
 $('debug').textContent=`检测器 v3 · 与最近照片差异 ${fromPhoto.score.toFixed(1)} · 变化像素 ${fromPhoto.changedRatio.toFixed(2)}% · ${changing?'等待稳定':'监测中'}`;

 if(!changing && different && t-lastShot>v.cool){
  if(!changeSince)changeSince=t;
  if(t-changeSince>=CHANGE_CONFIRM_MS){
   changing=true;changeStartedAt=t;stableSince=0;stableAnchor=null;changeSince=0;
   say(`内容与最近照片不一致 · 等待画面稳定…`);
  }
 }else if(!changing){
  changeSince=0;
 }

 if(changing){
  let settled=false;
  if(frameDelta.mean<v.stable){
   if(!stableSince){stableSince=t;stableAnchor=cur}
   // A slow cross-fade may look unchanged between adjacent frames. Also
   // compare with the frame at the start of the stable window so cumulative
   // movement cannot be mistaken for a settled page.
   const drift=frameMetrics(cur,stableAnchor);
   if(drift.mean>=v.stable || drift.changedRatio>=1.2){
    stableSince=t;stableAnchor=cur;
   }
   settled=t-stableSince>=v.stableMs;
  }else{stableSince=0;stableAnchor=null}
  // Some projectors flicker continuously and never look perfectly still to
  // the camera. Do not let that prevent a capture forever.
  const maxWaitReached=t-changeStartedAt>=Math.max(2500,v.stableMs+1600);
  if(settled||maxWaitReached){
   const finalMetrics=frameMetrics(cur,lastPhotoFrame);
   if(isPageChange(finalMetrics,v.change*.72)) void saveFrame(cur);
   else say('画面恢复为最近照片 · 未保存');
   changing=false;stableSince=0;stableAnchor=null;changeStartedAt=0;
  }
 }
 prev=cur;
 scheduleLoop(token);
}

$('auto').onclick=()=>{
 running=!running;
 $('auto').textContent=running?'暂停自动记录':'开始自动记录';
 if(running){
  runToken++;lastPhotoFrame=null;prev=null;changing=false;
  stableSince=0;stableAnchor=null;changeSince=0;changeStartedAt=0;
  say('正在拍摄第一张参考照片…');loop(performance.now(),runToken);
 }else{
  runToken++;clearTimeout(timer);cancelAnimationFrame(raf);say('自动记录已暂停');
 }
};

$('export').onclick=async()=>{
 for(const s of shots){
  const a=document.createElement('a');a.href=s.url;a.download=s.name;
  document.body.appendChild(a);a.click();a.remove();
  await new Promise(r=>setTimeout(r,250));
 }
 say(`已请求导出 ${shots.length} 张照片`);
};

document.documentElement.dataset.appReady='true';
if(new URLSearchParams(location.search).has('selftest')){
 const passed=detectorSelfTest();
 document.documentElement.dataset.detectorSelftest=passed?'pass':'fail';
 say(`检测自测：${passed?'通过':'失败'}`);
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
